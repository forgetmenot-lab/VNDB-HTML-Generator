name: Build and publish v1.4

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.4.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.4
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Verify source
        run: node verify.cjs
      - name: Install dependencies
        working-directory: src
        run: npm ci
      - name: Build portable executable
        working-directory: src
        run: npm run build -- --publish never
      - name: Publish v1.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.4 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v1.4 already exists; refusing to overwrite it.' }
          Copy-Item -LiteralPath 'src/dist/VNDB-HTML-Generator.exe' -Destination 'src/dist/VNDB-HTML-Generator-v1.4.exe'
          gh release create v1.4 src/dist/VNDB-HTML-Generator-v1.4.exe --target "$env:GITHUB_SHA" --title "VNDB HTML Generator v1.4" --notes-file RELEASE-v1.4.md --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
