<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNDB → HTML Generator v1.3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
  :root {
    --bg:#0f0f13;--surface:#1a1a22;--border:#2e2e3e;
    --accent:#7c6af7;--accent2:#a78bfa;--text:#e2e2f0;
    --muted:#8888aa;--success:#4ade80;--error:#f87171;--warn:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

  /* 헤더 */
  .app-header{flex-shrink:0;background:#13131a;border-bottom:1px solid var(--border);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;}
  .app-header h1{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:600;color:var(--accent2);}
  .app-header h1 span{font-size:.72rem;color:var(--muted);margin-left:8px;font-weight:400;}
  .server-status{display:flex;align-items:center;gap:6px;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--border);}
  .status-dot.ok{background:var(--success);}
  .status-dot.fail{background:var(--error);}
  .status-text{font-size:.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}

  /* 바디 2컬럼 */
  .app-body{flex:1;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;}

  /* 공통 패널 */
  .panel{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow:hidden;}
  .panel-left{border-right:1px solid var(--border);}

  /* 레이블 */
  .label{font-size:.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}

  /* 입력 */
  input[type=text],input[type=password]{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.85rem;padding:9px 12px;border-radius:8px;outline:none;transition:border-color .2s;}
  input:focus{border-color:var(--accent);}

  /* 모델 드롭다운 */
  select{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82rem;padding:0 12px;border-radius:8px;outline:none;cursor:pointer;height:38px;}
  select:focus{border-color:var(--accent);}

  /* API Key + 모델 한 줄 */
  .key-model-row{display:flex;gap:10px;align-items:flex-start;}
  .key-model-row .key-col{flex:1;}
  .key-model-row .model-col{flex-shrink:0;}

  /* 눈 아이콘 버튼 */
  .eye-btn{background:none;border:none;cursor:pointer;padding:0 4px;color:var(--muted);display:flex;align-items:center;transition:color .2s;flex-shrink:0;}
  .eye-btn:hover{color:var(--text);}
  .key-input-wrap{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;transition:border-color .2s;height:38px;}
  .key-input-wrap:focus-within{border-color:var(--accent);}
  .key-input-wrap input{border:none;background:transparent;outline:none;flex:1;padding:0 12px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.85rem;height:100%;}

  /* 저장 배지 */
  .save-badge{font-size:.68rem;color:var(--success);font-family:'JetBrains Mono',monospace;opacity:0;transition:opacity .3s;white-space:nowrap;}
  .save-badge.show{opacity:1;}

  /* 토글 스위치 */
  .toggle-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .toggle-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .toggle-label{font-size:.88rem;color:var(--text);}
  .toggle-switch{width:36px;height:20px;border-radius:10px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
  .toggle-switch.on{background:var(--accent);}
  .toggle-switch::after{content:'';width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;}
  .toggle-switch.on::after{left:18px;}

  /* 세그먼트 버튼 */
  .segment{display:flex;background:var(--bg);border-radius:7px;padding:3px;gap:3px;}
  .seg-btn{flex:1;padding:6px 0;text-align:center;font-size:.78rem;border-radius:5px;cursor:pointer;color:var(--muted);transition:background .2s,color .2s;}
  .seg-btn.active{background:var(--accent);color:#fff;}

  /* URL 행 */
  .url-row{display:flex;gap:8px;}
  .url-row input{flex:1;}

  /* 버튼 */
  button.primary{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s;}
  button.primary:hover{background:var(--accent2);}
  button.primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}
  button.secondary{background:transparent;border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:.85rem;cursor:pointer;transition:border-color .2s;}
  button.secondary:hover{border-color:var(--accent);}

  /* 로그 박스 */
  .log-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:.74rem;line-height:1.95;overflow-y:auto;min-height:0;}
  .log-step.ok::before{content:"✓ ";color:var(--success);}
  .log-step.fail::before{content:"✗ ";color:var(--error);}
  .log-step.run::before{content:"⟳ ";color:var(--warn);}

  /* 코드박스 */
  .code-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:.76rem;line-height:1.75;white-space:pre-wrap;word-break:break-all;color:#c8c8e8;overflow-y:auto;min-height:0;}

  /* 복사 메시지 */
  .copy-msg-box{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.22);border-radius:8px;padding:9px 14px;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .3s;pointer-events:none;}
  .copy-msg-box.show{opacity:1;}
  .copy-msg-box span{font-size:.78rem;color:var(--success);font-family:'JetBrains Mono',monospace;}

  /* 버튼 행 */
  .btn-row{display:flex;gap:8px;}
  .btn-row button{flex:1;}

  .hint{font-size:.7rem;color:var(--muted);margin-top:4px;}
  .hint a{color:var(--accent2);text-decoration:none;}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="app-header">
  <h1>VNDB → HTML Generator <span>v1.3</span></h1>
  <div class="server-status">
    <div class="status-dot" id="proxyDot"></div>
    <span class="status-text" id="proxyText">확인 중...</span>
  </div>
</div>

<!-- 바디 -->
<div class="app-body">

  <!-- 왼쪽 패널 -->
  <div class="panel panel-left">

    <!-- API Key + 모델 -->
    <div class="key-model-row">
      <div class="key-col">
        <div class="label">Gemini API Key</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="key-input-wrap" style="flex:1;">
            <input type="password" id="apiKeyInput" placeholder="AIza..." oninput="saveKey()" />
            <button class="eye-btn" onclick="toggleKeyVisibility()" title="API Key 표시/숨기기">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="save-badge" id="saveBadge">저장됨 ✓</span>
        </div>
        <div class="hint"><a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>에서 무료 발급</div>
      </div>
      <div class="model-col">
        <div class="label">모델</div>
        <select id="modelSelect" onchange="saveModel()" style="width:auto;">
          <option value="gemini-3.5-flash">gemini-3.5-flash (기본)</option>
          <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
          <option value="gemini-3.1-pro">gemini-3.1-pro</option>
        </select>
      </div>
    </div>

    <!-- VNDB 이미지 업로드 모드 -->
    <div class="toggle-wrap">
      <div class="toggle-header">
        <span class="toggle-label">VNDB 이미지 업로드 모드</span>
        <div class="toggle-switch" id="uploadToggle" onclick="toggleUpload()"></div>
      </div>
      <div class="segment">
        <div class="seg-btn active" id="segSafe" onclick="setImageMode('safe')">일반 이미지만</div>
        <div class="seg-btn" id="segAdult" onclick="setImageMode('adult')">성인 이미지 포함</div>
      </div>
      <!-- 폴더 선택 (업로드 모드 ON일 때만 표시) -->
      <div id="folderSection" style="display:none;margin-top:10px;">
        <div class="label" style="margin-bottom:5px;">이미지 저장 폴더</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" id="folderPathDisplay">폴더를 선택해주세요</div>
          <button class="secondary" style="white-space:nowrap;padding:8px 14px;" onclick="selectFolder()">폴더 선택</button>
        </div>
        <div id="openFolderBtn" style="display:none;margin-top:8px;">
          <button class="secondary" style="width:100%;" onclick="openSavedFolder()">📁 저장된 이미지 폴더 열기</button>
        </div>
      </div>
    </div>

    <!-- VNDB URL -->
    <div>
      <div class="label">VNDB URL</div>
      <div class="url-row">
        <input type="text" id="urlInput" placeholder="URL 1개: https://vndb.org/v22783 또는 r63343 | 다중: v1, v2, r456" style="font-size:.9rem;" />
        <button class="primary" id="runBtn" onclick="run()">생성</button>
      </div>
    </div>

    <!-- 진행 로그 -->
    <div class="label" style="margin-bottom:0;">진행 로그</div>
    <div class="log-box" id="logBox"></div>

  </div>

  <!-- 오른쪽 패널 -->
  <div class="panel">

    <div class="label" style="margin-bottom:0;">생성된 코드</div>

    <!-- 코드박스 -->
    <div class="code-box" id="codeBox"></div>

    <!-- 복사 완료 메시지 -->
    <div class="copy-msg-box" id="copyMsgBox">
      <span style="font-size:.9rem;">✓</span>
      <span>클립보드에 복사되었습니다</span>
    </div>

    <!-- 버튼 -->
    <div class="btn-row">
      <button class="primary" onclick="copyCode()">클립보드 복사</button>
      <button class="secondary" onclick="downloadTxt()">TXT 다운로드</button>
    </div>

  </div>
</div>

<script>
const PROXY_VN        = "http://localhost:17373/vn";
const PROXY_RELEASE   = "http://localhost:17373/release";
const PROXY_TRANSLATE = "http://localhost:17373/translate";

let generatedHtml = "";
let uploadEnabled = false;
let imageMode     = "safe";
let imgSavePath   = "";

window.addEventListener("DOMContentLoaded", () => {
  // localStorage 복원
  const savedKey    = localStorage.getItem("gemini_api_key");
  const savedModel  = localStorage.getItem("gemini_model");
  const savedUpload = localStorage.getItem("upload_mode");
  const savedImg    = localStorage.getItem("image_mode");

  if (savedKey)   document.getElementById("apiKeyInput").value = savedKey;
  if (savedModel) document.getElementById("modelSelect").value = savedModel;
  if (savedUpload === "1") { uploadEnabled = true; document.getElementById("uploadToggle").classList.add("on"); document.getElementById("folderSection").style.display = "block"; }
  if (savedImg === "adult") { imageMode = "adult"; document.getElementById("segSafe").classList.remove("active"); document.getElementById("segAdult").classList.add("active"); }
  // img_save_path는 배포 시 오염 방지를 위해 세션마다 초기화 (저장 안 함)

  document.getElementById("urlInput").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
  checkProxy();
});

async function checkProxy() {
  const dot = document.getElementById("proxyDot");
  const txt = document.getElementById("proxyText");
  try {
    const r = await fetch(PROXY_VN, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({filters:["id","=","v1"],fields:"title"}) });
    if (!r.ok) throw new Error();
    dot.className = "status-dot ok"; txt.textContent = "서버 연결됨";
  } catch {
    dot.className = "status-dot fail"; txt.textContent = "서버 연결 안 됨 — 앱을 재시작해주세요";
  }
}

function saveKey() {
  localStorage.setItem("gemini_api_key", document.getElementById("apiKeyInput").value.trim());
  const b = document.getElementById("saveBadge");
  b.classList.add("show"); clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.remove("show"), 1500);
}

function saveModel() {
  localStorage.setItem("gemini_model", document.getElementById("modelSelect").value);
}

function toggleUpload() {
  uploadEnabled = !uploadEnabled;
  document.getElementById("uploadToggle").classList.toggle("on", uploadEnabled);
  document.getElementById("folderSection").style.display = uploadEnabled ? "block" : "none";
  localStorage.setItem("upload_mode", uploadEnabled ? "1" : "0");
}

async function selectFolder() {
  const r = await fetch("http://localhost:17373/selectfolder");
  const d = await r.json();
  if (d.canceled) return;
  imgSavePath = d.folderPath;
  document.getElementById("folderPathDisplay").textContent = imgSavePath;
  document.getElementById("folderPathDisplay").style.color = "var(--text)";
}

function openSavedFolder() {
  if (!imgSavePath) return;
  fetch("http://localhost:17373/openfolder?path=" + encodeURIComponent(imgSavePath));
}

function setImageMode(mode) {
  imageMode = mode;
  document.getElementById("segSafe").classList.toggle("active", mode === "safe");
  document.getElementById("segAdult").classList.toggle("active", mode === "adult");
  localStorage.setItem("image_mode", mode);
}

function log(msg, state = "") {
  const box = document.getElementById("logBox");
  const d = document.createElement("div");
  d.className = "log-step " + state;
  d.textContent = msg;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function clearLog() {
  document.getElementById("logBox").innerHTML = "";
  document.getElementById("codeBox").textContent = "";
  document.getElementById("copyMsgBox").classList.remove("show");
}

function extractId(url) {
  const s = url.trim();
  const m = s.match(/vndb\.org\/(v\d+)/i) || s.match(/^(?:vndb|vn)(\d+)$/i) || s.match(/^v(\d+)$/i);
  if (!m) return null;
  return "v" + m[1].replace(/^v/i, "");
}

async function resolveToVnId(input) {
  const s = input.trim();
  // v 형식이면 그대로 반환
  const vnId = extractId(s);
  if (vnId) return vnId;
  // r 형식이면 Release API로 상위 VN ID 조회
  const rId = extractReleaseId(s);
  if (!rId) return null;
  const r = await fetch(PROXY_RELEASE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filters: ["id", "=", rId], fields: "vns.id", results: 1 })
  });
  if (!r.ok) throw new Error(`릴리즈 조회 실패: HTTP ${r.status}`);
  const data = await r.json();
  const vnRaw = data.results?.[0]?.vns?.[0]?.id;
  if (!vnRaw) throw new Error(`${rId}에 연결된 VN을 찾을 수 없습니다`);
  return vnRaw; // 이미 "v1234" 형태로 반환됨
}

function isEnglishAlias(str) {
  return /^[A-Za-z0-9\s\-_'!?.:,&()]+$/.test(str.trim());
}

function descToHtml(text) {
  if (!text) return "<p>(설명 없음)</p>";
  const clean = text.replace(/\[spoiler\][\s\S]*?\[\/spoiler\]/gi,"").replace(/\[[\w/]+\]/g,"").trim();
  return clean.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>`<p>${l}</p>`).join("\n<br>\n");
}

function formatPlayTime(length, lengthMinutes) {
  const labels = {1:"Very short (< 2 hours)",2:"Short (2 - 10 hours)",3:"Medium (10 - 30 hours)",4:"Long (30 - 50 hours)",5:"Very long (> 50 hours)"};
  if (!length && !lengthMinutes) return "정보 없음";
  let result = labels[length] || "";
  if (lengthMinutes) {
    const h = Math.floor(lengthMinutes/60), m = lengthMinutes%60;
    const t = h > 0 ? (m > 0 ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
    result = result ? `${result} / ${t}` : t;
  }
  return result || "정보 없음";
}

function buildImagePool(vnData) {
  const cover  = vnData.image?.url ? { url: vnData.image.url } : null;
  const shots  = (vnData.screenshots || []).map(s => ({ url: s.url, sexual: Math.round(s.sexual || 0) }));
  const safe   = shots.filter(s => s.sexual === 0);
  const sug    = shots.filter(s => s.sexual === 1);
  const exp    = shots.filter(s => s.sexual === 2);

  if (imageMode === "safe") {
    const pool = [];
    if (cover) pool.push(cover.url);
    safe.forEach(s => pool.push(s.url));
    return pool.slice(0, 5);
  } else {
    const fixed = []; const usedUrls = new Set();
    if (cover) { fixed.push(cover.url); usedUrls.add(cover.url); }
    const fs = sug[0], fe = exp[0];
    if (fs) { fixed.push(fs.url); usedUrls.add(fs.url); }
    else if (fe) { fixed.push(fe.url); usedUrls.add(fe.url); }
    if (fe && !usedUrls.has(fe.url)) { fixed.push(fe.url); usedUrls.add(fe.url); }
    else if (fs && !usedUrls.has(fs.url)) { fixed.push(fs.url); usedUrls.add(fs.url); }
    const pool = [];
    [...safe,...sug,...exp].forEach(s => { if (!usedUrls.has(s.url)) pool.push(s.url); });
    if (!cover && pool.length > 0) fixed.unshift(pool.shift());
    return [...fixed, ...pool.slice(0, Math.max(0, 6-fixed.length))];
  }
}

function buildHtml(url, originalTitle, developer, publisher, alias, rating, votecount, length, lengthMinutes, descHtml, ageRating, tagStr) {
  const ratingStr = rating ? `${(rating/10).toFixed(2)} / 10.00` : "정보 없음";
  const voteStr   = votecount ? `${votecount.toLocaleString()}표` : "정보 없음";
  const playStr   = formatPlayTime(length, lengthMinutes);
  const pubFmt    = publisher.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>`<p>${s}</p>`).join("\n");
  const imgSection = "[이미지]";
  const footer = `<hr>\n\n＊한패출처 : \n<br>\n<br>\n＊링크 : `;
  const th = 'style="width:100px;"';
  const tagRow = `<tr><td ${th}><b>게임 태그</b></td><td><details open=""><summary>스포 주의 (클릭하여 펼치기)</summary><div data-type="detailsContent">${tagStr.split(",").map(t=>`<p>${t.trim()}</p>`).join("\n")}</div></details></td></tr>`;

  return `${imgSection}

<table>
<tr><td ${th}><b>원제</b></td><td>${originalTitle}</td></tr>
<tr><td ${th}><b>개발사</b></td><td>${developer}</td></tr>
<tr><td ${th}><b>퍼블리셔</b></td><td>${pubFmt}</td></tr>
<tr><td ${th}><b>별칭</b></td><td>${alias}</td></tr>
<tr><td ${th}><b>VNDB</b></td><td><a href="${url}">${url}</a></td></tr>
<tr><td ${th}><b>플레이 타임</b></td><td>${playStr}</td></tr>
<tr><td ${th}><b>연령등급</b></td><td>${ageRating}</td></tr>
<tr><td ${th}><b>평점</b></td><td>${ratingStr} (${voteStr})</td></tr>
${tagRow}
</table>
<br>
[내용]
<br>
<br>
<details open=""><summary><b>게임 개요(VNDB)</b></summary><div data-type="detailsContent">
${descHtml}
</div></details>

${footer}`;
}

async function fetchVndb(vnId) {
  const base = "title, alttitle, description, developers.name, aliases, rating, votecount, length, length_minutes, tags.name, tags.rating, tags.spoiler, tags.category";
  const imgs = uploadEnabled ? ", image.url, image.sexual, screenshots.url, screenshots.sexual" : "";
  const r = await fetch(PROXY_VN, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ filters:["id","=",vnId], fields: base+imgs })
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// 언어코드 → 대문자 태그 (kone.gg 이미지 정책으로 국기 이미지 사용 불가)
const LANG_CODE = {
  "ja":"JP","en":"EN","zh-Hans":"CN","zh-Hant":"TW","ko":"KR",
  "ru":"RU","fr":"FR","de":"DE","es":"ES","it":"IT",
  "pt-br":"BR","pt-pt":"PT","pl":"PL","cs":"CZ","hu":"HU",

async function urlToBase64(url) {
  const r = await fetch(`http://localhost:17373/imgproxy?url=${encodeURIComponent(url)}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();

async function fetchAgeRating(vnId) {
  const r = await fetch(PROXY_RELEASE, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ filters:["vn","=",["id","=",vnId]], fields:"languages.lang, minage", results:50 })
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  const jaReleases = (data.results||[]).filter(rel =>
    (rel.languages||[]).some(l => l.lang === "ja")
  );
  if (!jaReleases.length) return "정보 없음";
  function formatAge(m) {
    if (m === null || m === undefined) return "전연령";
    if (m === 0) return "전연령";
    return `${m}+`;
  }
  const ageSet = [...new Set(jaReleases.map(r => formatAge(r.minage)).filter(Boolean))];
  return ageSet.length ? [...new Set(ageSet)].join(", ") : "전연령";
}

async function fetchPublishers(vnId) {
  const r = await fetch(PROXY_RELEASE, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ filters:["vn","=",["id","=",vnId]], fields:"producers.name, producers.publisher, languages.lang", results:50 })
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  const langMap = new Map();
  for (const rel of data.results||[]) {
    const pubs = (rel.producers||[]).filter(p=>p.publisher).map(p=>p.name);
    if (!pubs.length) continue;
    for (const lang of (rel.languages||[]).map(l=>l.lang)) {
      if (!langMap.has(lang)) langMap.set(lang, new Set());
      pubs.forEach(n=>langMap.get(lang).add(n));
    }
  }
  if (!langMap.size) return "미상";
  const order = ["ja","en","ko","zh-Hans","zh-Hant"];
  const sorted = [...order.filter(l=>langMap.has(l)), ...[...langMap.keys()].filter(l=>!order.includes(l)).sort()];
  return sorted.map(lang=>`[${LANG_CODE[lang]||lang.toUpperCase()}] ${[...langMap.get(lang)].join(" & ")}`).join("\n");
}

async function translateWithGemini(text, apiKey, mode="desc") {
  const model = document.getElementById("modelSelect").value;
  const r = await fetch(PROXY_TRANSLATE, {
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":apiKey},
    body: JSON.stringify({ text, mode, model })
  });
  const d = await r.json();
  if (d.error === "CONTENT_BLOCKED") throw new Error("CONTENT_BLOCKED");
  if (!r.ok) throw new Error(d?.error||`HTTP ${r.status}`);
  if (!d.translated) throw new Error("번역 결과 없음");
  return d.translated;
}

  return navigator.clipboard.write([
    new ClipboardItem({
      "text/html": new Blob([html], { type: "text/html" }),
      "text/plain": new Blob([html], { type: "text/plain" })
    })
  ]);

async function run() {
  const url    = document.getElementById("urlInput").value.trim();
  const apiKey = document.getElementById("apiKeyInput").value.trim();
  clearLog();
  document.getElementById("runBtn").disabled = true;

  if (!url) { log("URL을 입력해주세요.", "fail"); document.getElementById("runBtn").disabled=false; return; }

  // 다중 URL 감지 (쉼표로 구분)
  const tokens = parseMultiUrls(url);
  if (tokens.length >= 2) {
    log(`다중 모드: ${tokens.length}개 입력 감지됨`, "ok");
    const resolved = await resolveMultiTokens(tokens, log);
    if (!resolved.length) { log("처리 가능한 ID가 없습니다.", "fail"); document.getElementById("runBtn").disabled=false; return; }
    const html = await runMulti(resolved, apiKey);
    if (html) {
      generatedHtml = html;
      document.getElementById("codeBox").textContent = generatedHtml;
      copyAsRichText(generatedHtml).then(() => { showCopyMsg(); }).catch(() => {});
    }
    document.getElementById("runBtn").disabled = false;
    return;
  }

  // 단일 입력: 릴리즈(r) 우선 분기 — VN 모드와 완전히 다른 전용 파이프라인
  const rId = extractReleaseId(url);
  if (rId) {
    log(`릴리즈 ID 추출: ${rId}`, "ok");
    let html;
    try {
      html = await runRelease(rId, apiKey, log);
    } catch (e) {
      log(`릴리즈 처리 실패: ${e.message}`, "fail");
      document.getElementById("runBtn").disabled = false;
      return;
    }
    if (html) {
      generatedHtml = html;
      document.getElementById("codeBox").textContent = generatedHtml;
      copyAsRichText(generatedHtml).then(() => { showCopyMsg(); }).catch(() => {});
    }
    document.getElementById("runBtn").disabled = false;
    return;
  }

  // 단일 입력: VN(v)
  const vnId = extractId(url);
  if (!vnId) { log("vndb.org URL이 아니거나 형식이 올바르지 않습니다.", "fail"); document.getElementById("runBtn").disabled=false; return; }
  log(`ID 추출: ${vnId}`, "ok");

  // 1. VN 데이터
  log("VNDB VN 데이터 조회 중...", "run");
  let vnData;
  try {
    const res = await fetchVndb(vnId);
    vnData = res.results?.[0];
    log("VN 데이터 수신", "ok");
  } catch(e) { log(`VNDB 호출 실패: ${e.message}`, "fail"); document.getElementById("runBtn").disabled=false; return; }
  if (!vnData) { log("결과 없음 — ID를 확인해주세요.", "fail"); document.getElementById("runBtn").disabled=false; return; }

  const developer     = vnData.developers?.map(d=>d.name).join(", ")||"미상";
  const rawDesc       = vnData.description||"";
  const rating        = vnData.rating||null;
  const votecount     = vnData.votecount||null;
  const length        = vnData.length||null;
  const lengthMinutes = vnData.length_minutes||null;
  const originalTitle = vnData.alttitle||vnData.title||"미상";
  log(`원제: ${originalTitle}`, "ok");
  log(`개발사: ${developer}`, "ok");

  // 2. 이미지 (업로드 모드)
  if (uploadEnabled) {
    if (!imgSavePath) {
      log("이미지 저장 폴더가 설정되지 않았습니다. 폴더를 선택해주세요.", "fail");
      document.getElementById("runBtn").disabled = false;
      return;
    }
    const rawUrls = buildImagePool(vnData);
    log(`이미지 저장 중: ${rawUrls.length}장 (${imageMode==="safe"?"일반":"성인 포함"})...`, "run");
    let savedCount = 0;
    await Promise.all(rawUrls.map(async (imgUrl, i) => {
      const ext = imgUrl.split(".").pop().split("?")[0] || "jpg";
      const filename = `${vnId}_${String(i+1).padStart(2,"0")}.${ext}`;
      try {
        const r = await fetch("http://localhost:17373/saveimg", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: imgUrl, folderPath: imgSavePath, filename })
        });
        const d = await r.json();
        if (d.ok) savedCount++;
        else log(`이미지 저장 실패: ${filename}`, "fail");
      } catch(e) { log(`이미지 저장 오류: ${e.message}`, "fail"); }
    }));
    log(`이미지 저장 완료: ${savedCount}장 → ${imgSavePath}`, "ok");
    document.getElementById("openFolderBtn").style.display = "block";
  }

  // 3. 퍼블리셔 + 연령등급 병렬 조회
  log("퍼블리셔 / 연령등급 조회 중...", "run");
  let publisher = "미상";
  let ageRating = "정보 없음";
  try {
    [publisher, ageRating] = await Promise.all([
      fetchPublishers(vnId),
      fetchAgeRating(vnId)
    ]);
    log(`퍼블리셔 수신 / 연령등급: ${ageRating}`, "ok");
  } catch(e) { log(`퍼블리셔/연령등급 조회 실패: ${e.message}`, "fail"); }

  // 4. 별칭
  const engAliases = (vnData.aliases||[]).filter(isEnglishAlias);
  let aliasResult = "없음";
  if (engAliases.length > 0) {
    if (!apiKey) { aliasResult = engAliases.join(", "); log("API Key 없음 → 별칭 변환 생략", "fail"); }
    else {
      log("별칭 한국어 발음 변환 중...", "run");
      try { aliasResult = await translateWithGemini(engAliases.join(", "), apiKey, "alias"); log(`별칭: ${aliasResult}`, "ok"); }
      catch(e) {
        aliasResult = engAliases.join(", ");
        log(e.message==="CONTENT_BLOCKED" ? "별칭 변환 — Gemini가 거부했습니다. 원문 사용" : `별칭 변환 실패: ${e.message}`, "fail");
      }
    }
  } else { log("영문 별칭 없음", "ok"); }

  // 5. Description 번역
  let descHtml;
  if (!rawDesc) { descHtml = "<p>(설명 없음)</p>"; }
  else if (!apiKey) { log("API Key 없음 → 원문 삽입", "fail"); descHtml = descToHtml(rawDesc); }
  else {
    const model = document.getElementById("modelSelect").value;
    log(`Description 번역 중... (${model})`, "run");
    try { descHtml = descToHtml(await translateWithGemini(rawDesc, apiKey, "desc")); log("번역 완료", "ok"); }
    catch(e) {
      log(e.message==="CONTENT_BLOCKED" ? "번역 거부 — Gemini 콘텐츠 필터로 인해 거부되었습니다. 원문 삽입" : `번역 실패: ${e.message} → 원문 삽입`, "fail");
      descHtml = descToHtml(rawDesc);
    }
  }

  // 6. 태그 처리
  const rawTags = (vnData.tags||[]).sort((a,b)=>b.rating-a.rating).slice(0,5);
  let tagStr = "This VN has no tags assigned to it (yet).";
  if (rawTags.length > 0) {
    const tagNames = rawTags.map(t => t.name).join(", ");
    if (!apiKey) {
      tagStr = tagNames;
      log("API Key 없음 → 태그 원문 사용", "fail");
    } else {
      log("태그 번역 중...", "run");
      try {
        tagStr = await translateWithGemini(tagNames, apiKey, "alias");
        log("태그 번역 완료", "ok");
      } catch(e) {
        tagStr = tagNames;
        log(e.message==="CONTENT_BLOCKED" ? "태그 번역 거부 — 원문 사용" : `태그 번역 실패: ${e.message} → 원문 사용`, "fail");
      }
    }
  } else {
    log("태그 정보 없음", "ok");
  }

  // 7. HTML 생성 + 자동 복사
  generatedHtml = buildHtml(`https://vndb.org/${vnId}`, originalTitle, developer, publisher, aliasResult, rating, votecount, length, lengthMinutes, descHtml, ageRating, tagStr);
  document.getElementById("codeBox").textContent = generatedHtml;
  log("생성 완료 ✓", "ok");

  copyAsRichText(generatedHtml).then(() => { showCopyMsg(); }).catch(()=>{});

  document.getElementById("runBtn").disabled = false;
}

/**
 * MULTI_MODE.JS
 * =============
 * VNDB URL 2개 이상 입력 시 다중 처리 모드.
 * 기존 단일 처리 run()과 완전히 분리된 독립 로직.
 *
 * v1.3: 다중 입력에 r(릴리즈) 토큰이 섞여도 테이블 포맷은 기존 VN 집계 포맷을
 * 그대로 유지한다. 단 VNDB 주소 행만 입력된 r 주소 그대로 표기한다
 * (release_mode.js의 릴리즈 전용 필드/파이프라인은 다중모드에 적용하지 않음).
 *
 * 출력 형태:
 *   [게임1 테이블]
 *   <br><hr><br>
 *   ...
 *   [게임n 테이블]
 *   ＊ 링크 :
 *
 * 테이블 항목: 제목(병합), 이미지(병합), 원제, 개발사, VNDB, 플레이타임, 평점, 게임태그, 한패출처, 특이사항
 * 퍼블리셔/연령등급/별칭 제외 (다중 모드 전용 스펙)
 */

// ---- URL 파싱 ----

/**
 * 입력 문자열에서 토큰 배열 추출 (v/r 원문 그대로, 정규화는 resolveMultiTokens에서 처리)
 */
function parseMultiUrls(input) {
  return input
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);
}

/**
 * 각 토큰을 { vnId, displayUrl } 형태로 정규화.
 * r 토큰은 VN ID로 해석하되 표시 주소는 입력된 r 주소를 그대로 유지한다.
 */
async function resolveMultiTokens(tokens, log) {
  const out = [];
  for (const token of tokens) {
    const rId = extractReleaseId(token);
    if (rId) {
      try {
        const vnId = await resolveToVnId(token);
        if (vnId) out.push({ vnId, displayUrl: `https://vndb.org/${rId}` });
        else log(`인식할 수 없는 입력: ${token}`, "fail");
      } catch (e) {
        log(`${token} → ${e.message}`, "fail");
      }
      continue;
    }
    const vId = extractId(token);
    if (vId) {
      out.push({ vnId: vId, displayUrl: `https://vndb.org/${vId}` });
    } else {
      log(`인식할 수 없는 입력: ${token}`, "fail");
    }
  }
  return out;
}

async function fetchVndbMulti(vnId) {
  const r = await fetch(PROXY_VN, {

    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      filters: ["id", "=", vnId],
      fields: "title, alttitle, description, developers.name, rating, votecount, length, length_minutes, tags.name, tags.rating, tags.spoiler"
    })

  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  return data.results?.[0] || null;
}

function buildMultiGameTable(vnId, vnData, tagStr, displayUrl) {
  const originalTitle = vnData.alttitle || vnData.title || "미상";
  const developer = vnData.developers?.map(d => d.name).join(", ") || "미상";
  const vnUrl = displayUrl || `https://vndb.org/${vnId}`;
  const playStr = formatPlayTime(vnData.length || null, vnData.length_minutes || null);
  const rating = vnData.rating || null;
  const votecount = vnData.votecount || null;
  const ratingStr = rating ? `${(rating / 10).toFixed(2)} / 10.00` : "정보 없음";
  const voteStr = votecount ? `${votecount.toLocaleString()}표` : "정보 없음";

  const tagRow = tagStr
    ? `<tr><td ${tw}><b>게임 태그</b></td><td><details open=""><summary>스포 주의 (클릭하여 펼치기)</summary><div data-type="detailsContent">${tagStr.split(",").map(t => `<p>${t.trim()}</p>`).join("\n")}</div></details></td></tr>`
    : "";
  return `<table>
<tr><td colspan="2"><b>제목</b></td></tr>
<tr><td colspan="2"><b>이미지</b></td></tr>
<tr><td ${tw}><b>원제</b></td><td>${originalTitle}</td></tr>
<tr><td ${tw}><b>개발사</b></td><td>${developer}</td></tr>
<tr><td ${tw}><b>VNDB</b></td><td><a href="${vnUrl}">${vnUrl}</a></td></tr>
<tr><td ${tw}><b>플레이 타임</b></td><td>${playStr}</td></tr>
<tr><td ${tw}><b>평점</b></td><td>${ratingStr} (${voteStr})</td></tr>
${tagRow}
<tr><td ${tw}><b>한패출처</b></td><td></td></tr>
<tr><td ${tw}><b>특이사항</b></td><td></td></tr>
</table>`;
}

// ---- 다중 모드 메인 진입점 ----

async function runMulti(resolvedTokens, apiKey) {
  const tables = [];

  for (let i = 0; i < resolvedTokens.length; i++) {
    const { vnId, displayUrl } = resolvedTokens[i];
    log(`[${i + 1}/${resolvedTokens.length}] ${vnId} 처리 중...`, "run");

    // VN 데이터 조회
    let vnData;
    try {
      vnData = await fetchVndbMulti(vnId);
      if (!vnData) { log(`${vnId} — 결과 없음, 건너뜀`, "fail"); continue; }
      log(`${vnId} — ${vnData.alttitle || vnData.title}`, "ok");
    } catch (e) {
      log(`${vnId} — 조회 실패: ${e.message}`, "fail");
      continue;
    }

    // 태그 처리 (상위 5개, rating 내림차순)
    const rawTags = (vnData.tags || []).sort((a, b) => b.rating - a.rating).slice(0, 5);
    let tagStr = "";
    if (rawTags.length > 0) {
      const tagNames = rawTags.map(t => t.name).join(", ");
      if (apiKey) {
        log(`${vnId} — 태그 번역 중...`, "run");
        tagStr = await translateTagsMulti(tagNames, apiKey, vnId);
        log(`${vnId} — 태그 완료`, "ok");
      } else {
        tagStr = tagNames;
      }
    }

    tables.push(buildMultiGameTable(vnId, vnData, tagStr, displayUrl));
  }

  if (!tables.length) {
    log("처리된 게임이 없습니다.", "fail");
    return null;
  }

  // 게임 사이: <hr>, 마지막 뒤: ＊ 링크 :
  const html = tables.join("\n<hr>\n") + "\n\n＊ 링크 : ";
  log(`다중 생성 완료 ✓ (${tables.length}개)`, "ok");
  return html;
}

// ---- 릴리즈 모드 (release_mode.js 인라인) ----
/**
 * RELEASE_MODE.JS
 * ================
 * 검색창에 릴리즈(r) 주소가 단독으로 입력됐을 때의 전용 파이프라인.
 * VN 주소(v) 입력과는 완전히 다른 출력 폼을 사용한다.
 *
 * 데이터 소스 우선순위:
 *   1. /release 단일 호출 (title, alttitle, minage, released, producers, vns.* 전부 중첩 조회)
 *   2. 릴리즈 자체에 없는 값(개발사 미표시, 연령등급 null)만 별도 호출로 보강
 *      - 개발사 없음 → /vn 호출 (developers.name)
 *      - 연령등급 null → 기존 fetchAgeRating(vnId) 재사용 (VN의 ja 릴리즈 집계)
 *   3. 평점/게임태그는 release 쿼리에 vns.rating/vns.votecount/vns.tags.*로 중첩 조회하므로
 *      별도 호출 불필요
 *
 * 관련제품(Relation) 항목은 VNDB Kana API가 노출하지 않는 필드라 제외됨.
 */

// ---- 릴리즈 ID 추출 ----

function extractReleaseId(url) {
  const s = url.trim();
  const m = s.match(/vndb\.org\/(r\d+)/i) || s.match(/^(?:vndb|vn)r(\d+)$/i) || s.match(/^r(\d+)$/i);
  if (!m) return null;
  return "r" + m[1].replace(/^r/i, "");
}

// ---- 릴리즈 데이터 조회 (VN 중첩 필드 포함 단일 호출) ----

async function fetchReleaseFull(rId) {
  const r = await fetch(PROXY_RELEASE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      filters: ["id", "=", rId],
      fields: "title, alttitle, minage, released, languages.lang, " +
               "producers.name, producers.developer, producers.publisher, " +
               "vns.id, vns.title, vns.alttitle, vns.rating, vns.votecount, " +
               "vns.tags.name, vns.tags.rating, vns.tags.spoiler, vns.tags.category"
    })
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  return data.results?.[0] || null;
}

// ---- 개발사 보강 (릴리즈에 없을 때만) ----

async function fetchVnDeveloper(vnId) {
  const r = await fetch(PROXY_VN, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filters: ["id", "=", vnId], fields: "developers.name" })
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  return data.results?.[0]?.developers?.map(d => d.name).join(", ") || "";
}

// ---- 게임 개요 조회 (release에 없는 필드라 VN 모드처럼 별도 호출) ----

async function fetchVnDescription(vnId) {
  const r = await fetch(PROXY_VN, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filters: ["id", "=", vnId], fields: "description" })
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  return data.results?.[0]?.description || "";
}

// ---- 퍼블리셔 포맷 (릴리즈 기준 단순화, VN 모드처럼 다중 언어 집계 안 함) ----

function formatReleasePublisher(release) {
  const pubs = (release.producers || []).filter(p => p.publisher).map(p => p.name);
  if (!pubs.length) return "미상";
  const langs = (release.languages || []).map(l => l.lang);
  const tag = langs.length ? (LANG_CODE[langs[0]] || langs[0].toUpperCase()) : "";
  return tag ? `[${tag}] ${pubs.join(" & ")}` : pubs.join(" & ");
}

// ---- 연령등급 포맷. null이면 fallback 필요 신호로 null 반환 ----

function formatReleaseAge(minage) {
  if (minage === null || minage === undefined) return null;
  if (minage === 0) return "전연령";
  return `${minage}+`;
}

// ---- HTML 생성 ----

function buildReleaseHtml(rId, release, developer, ageRatingStr, tagStr, descHtml) {
  const vn = release.vns?.[0] || {};
  const releaseTitle = release.title || vn.title || "미상";
  const releaseAltTitle = release.alttitle || vn.alttitle || releaseTitle;
  const publisher = formatReleasePublisher(release);
  const rating = vn.rating || null;
  const votecount = vn.votecount || null;
  const ratingStr = rating ? `${(rating / 10).toFixed(2)} / 10.00` : "정보 없음";
  const voteStr = votecount ? `${votecount.toLocaleString()}표` : "정보 없음";
  const releaseUrl = `https://vndb.org/${rId}`;
  const th = 'style="width:100px;"';
  const tagRow = tagStr
    ? `<tr><td ${th}><b>게임 태그</b></td><td><details open=""><summary>스포 주의 (클릭하여 펼치기)</summary><div data-type="detailsContent">${tagStr.split(",").map(t => `<p>${t.trim()}</p>`).join("\n")}</div></details></td></tr>`
    : "";

  return `[이미지]

<table>
<tr><td ${th}><b>타이틀</b></td><td>${releaseTitle}</td></tr>
<tr><td ${th}><b>원제</b></td><td>${releaseAltTitle}</td></tr>
<tr><td ${th}><b>개발사</b></td><td>${developer || "미상"}</td></tr>
<tr><td ${th}><b>퍼블리셔</b></td><td>${publisher}</td></tr>
<tr><td ${th}><b>VNDB</b></td><td><a href="${releaseUrl}">${releaseUrl}</a></td></tr>
<tr><td ${th}><b>발매일</b></td><td>${release.released || "정보 없음"}</td></tr>
<tr><td ${th}><b>연령등급</b></td><td>${ageRatingStr}</td></tr>
<tr><td ${th}><b>평점</b></td><td>${ratingStr} (${voteStr})</td></tr>
${tagRow}
</table>
<br>
[내용]
<br>
<br>
<details open=""><summary><b>게임 개요(VNDB)</b></summary><div data-type="detailsContent">
${descHtml}
</div></details>

<hr>

＊한패출처 : 
<br>
<br>
＊링크 : `;
}

// ---- 릴리즈 모드 메인 진입점 ----

async function runRelease(rId, apiKey, log) {
  log("릴리즈 데이터 조회 중...", "run");
  let release;
  try {
    release = await fetchReleaseFull(rId);
  } catch (e) {
    log(`릴리즈 조회 실패: ${e.message}`, "fail");
    return null;
  }
  if (!release) { log("결과 없음 — ID를 확인해주세요.", "fail"); return null; }
  log(`타이틀: ${release.title}`, "ok");

  const vnId = release.vns?.[0]?.id;
  if (!vnId) { log("연결된 VN을 찾을 수 없습니다.", "fail"); return null; }

  // 개발사: 릴리즈 producers에 developer 표시 없으면 VN 별도 조회
  let developer = (release.producers || []).filter(p => p.developer).map(p => p.name).join(", ");
  if (!developer) {
    log("릴리즈에 개발사 정보 없음 → VN 정보 조회 중...", "run");
    try { developer = await fetchVnDeveloper(vnId); }
    catch (e) { log(`개발사 조회 실패: ${e.message}`, "fail"); }
  }

  // 연령등급: 릴리즈 자체 minage 없으면 기존 fetchAgeRating(VN ja 릴리즈 집계) 재사용
  let ageRatingStr = formatReleaseAge(release.minage);
  if (ageRatingStr === null) {
    log("릴리즈에 연령등급 정보 없음 → VN 릴리즈 목록 조회 중...", "run");
    try { ageRatingStr = await fetchAgeRating(vnId); }
    catch (e) { ageRatingStr = "정보 없음"; log(`연령등급 조회 실패: ${e.message}`, "fail"); }
  }

  // 태그 번역 (VN 소속 필드, 이미 release 쿼리에서 중첩 조회됨)
  const vn = release.vns[0];
  const rawTags = (vn.tags || []).sort((a, b) => b.rating - a.rating).slice(0, 5);
  let tagStr = "";
  if (rawTags.length > 0) {
    const tagNames = rawTags.map(t => t.name).join(", ");
    if (apiKey) {
      log("태그 번역 중...", "run");
      try {
        tagStr = await translateWithGemini(tagNames, apiKey, "alias");
        log("태그 번역 완료", "ok");
      } catch (e) {
        tagStr = tagNames;
        log(e.message === "CONTENT_BLOCKED" ? "태그 번역 거부 — 원문 사용" : `태그 번역 실패: ${e.message} → 원문 사용`, "fail");
      }
    } else {
      tagStr = tagNames;
    }
  }

  // 게임 개요: release에 없는 필드라 VN 모드처럼 별도 호출 → 번역 → 완성된 폼으로 병합
  log("게임 개요 조회 중...", "run");
  let rawDesc = "";
  try { rawDesc = await fetchVnDescription(vnId); }
  catch (e) { log(`게임 개요 조회 실패: ${e.message}`, "fail"); }

  let descHtml;
  if (!rawDesc) { descHtml = "<p>(설명 없음)</p>"; }
  else if (!apiKey) { log("API Key 없음 → 원문 삽입", "fail"); descHtml = descToHtml(rawDesc); }
  else {
    const model = document.getElementById("modelSelect").value;
    log(`게임 개요 번역 중... (${model})`, "run");
    try { descHtml = descToHtml(await translateWithGemini(rawDesc, apiKey, "desc")); log("번역 완료", "ok"); }
    catch (e) {
      log(e.message === "CONTENT_BLOCKED" ? "번역 거부 — Gemini 콘텐츠 필터로 인해 거부되었습니다. 원문 삽입" : `번역 실패: ${e.message} → 원문 삽입`, "fail");
      descHtml = descToHtml(rawDesc);
    }
  }

  const html = buildReleaseHtml(rId, release, developer, ageRatingStr, tagStr, descHtml);
  log("생성 완료 ✓", "ok");
  return html;
}
