name: Build and publish v1.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.3.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v1.3
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Verify source
        run: node verify.cjs
      - name: Install dependencies
        working-directory: src
        run: npm ci
      - name: Build portable executable
        working-directory: src
        run: npm run build -- --publish never
      - name: Publish v1.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.3 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v1.3 already exists; refusing to overwrite it.' }
          gh release create v1.3 src/dist/VNDB-HTML-Generator.exe --target "$env:GITHUB_SHA" --title "VNDB HTML Generator v1.3" --notes-file RELEASE-v1.3.md --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
